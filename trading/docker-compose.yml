# 用 Docker 跑 freqtrade（不想装本地 Python 环境时用）
# 例: docker compose run --rm freqtrade backtesting --strategy EvoSeedStrategy
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: "no"
    volumes:
      - "./user_data:/freqtrade/user_data"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config.json
      --strategy EvoSeedStrategy
